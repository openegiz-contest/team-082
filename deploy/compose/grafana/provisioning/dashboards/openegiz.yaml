apiVersion: 1
providers:
  - name: openegiz
    folder: OpenEgiz
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
  # Filled by example overlays (examples/*/compose.yml); empty otherwise.
  - name: examples
    folder: OpenEgiz Examples
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/example-dashboards
  # Filled by the Bozshakol overlay (bozshakol/compose.yml); empty otherwise.
  - name: bozshakol
    folder: Бозшаколь
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/bozshakol-dashboards
